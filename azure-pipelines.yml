resources:
  webhooks:
    - webhook: IncomingWebhook      # Webhook alias (no hyphens!)
      connection: Dev-test          # Service connection name (matches Azure DevOps)

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
# Debug: Print all available parameters
- script: |
    echo "=========================================="
    echo "DEBUG: Checking if webhook data exists"
    echo "=========================================="
    echo "Full parameters object:"
    echo '${{ convertToJson(parameters) }}'
    echo "=========================================="
  displayName: 'Debug - Show All Parameters'

# 1. Print standard parameters passed from the webhook JSON body
- script: |
    echo "=========================================="
    echo "Webhook Triggered Pipeline Successfully!"
    echo "=========================================="
    echo "Attack ID: ${{ parameters.IncomingWebhook.message.id }}"
    echo "Simulations Count: ${{ parameters.IncomingWebhook.message.simulations_count }}"
    echo "Cloud Vendors: ${{ parameters.IncomingWebhook.message.cloud_vendors }}"
    echo "First Detected: ${{ parameters.IncomingWebhook.message.first_detected }}"
    echo "Details URL: ${{ parameters.IncomingWebhook.message.details_url }}"
    echo "=========================================="
  displayName: 'Display Incoming Webhook Payload'